name: Release

on:
  # Called inline from the Release-plz workflow after a tag is
  # created and the GitHub Release is published. The caller passes
  # the tag explicitly because `github.ref_name` is `main` when this
  # workflow is invoked via `workflow_call` from a push to main.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and upload assets for (e.g. v0.1.1)'
        required: true
        type: string
  # Manual re-run path: select an existing tag in the "Use workflow
  # from" dropdown to rebuild and re-upload binaries for it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag override. If empty, uses the ref selected above.'
        required: false
        type: string

# Group by tag so concurrent invocations for the same tag queue
# rather than race; different tags run independently.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # softprops/action-gh-release needs write access to create/update
    # the release and upload assets. The default GITHUB_TOKEN is
    # read-only when the repo's "Workflow permissions" setting is
    # "Read repository contents permission" (the default for repos
    # created since Feb 2023).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # All four target builds run in parallel.
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ -z "$tag" ]]; then
            echo "::error::No tag could be resolved from inputs.tag or github.ref_name" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          # Build the source at the released tag, not the workflow's
          # caller ref (which is `main` when invoked from release-plz).
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install probe-rs system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="rambo-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/rambo" "$name/"
          cp README.md LICENSE "$name/" 2>/dev/null || true
          tar czf "${name}.tar.gz" "$name"
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "rambo-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rambo.exe" "$name/"
          if (Test-Path README.md) { Copy-Item README.md "$name/" }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   "$name/" }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.ASSET }}
          generate_release_notes: true
